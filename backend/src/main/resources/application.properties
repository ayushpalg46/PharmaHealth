# Spring Application Config
spring.application.name=pharmahealth-backend
server.port=${PORT:8080}

# Database Configuration (supports local MySQL, Docker, and Cloud Aiven via env vars)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql-21-ayushpal-2c43.a.aivencloud.com:20661/defaultdb?sslMode=REQUIRED&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:avnadmin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Cloud Connection Pool (Optimized for stability & automatic reconnection)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.leak-detection-threshold=60000

# JPA & Hibernate (auto-creates and updates schema)
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Security
pharmahealth.app.jwtSecret=${JWT_SECRET:9a618248b64db62d15b300a07b0058e10b43631ff1ac15d1b777e7b92dec68d9}
pharmahealth.app.jwtExpirationMs=${JWT_EXPIRATION:86400000}

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
