# Spring Application Config
spring.application.name=pharmahealth-backend
server.port=${PORT:8080}

# Database Configuration (MySQL) - Overridable via environment variables on Render / Docker
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/pharmahealth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:rootpassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Security
pharmahealth.app.jwtSecret=${JWT_SECRET:9a618248b64db62d15b300a07b0058e10b43631ff1ac15d1b777e7b92dec68d9}
pharmahealth.app.jwtExpirationMs=${JWT_EXPIRATION:86400000}

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
