services:
  # Spring Boot Backend API
  - type: web
    name: pharmahealth-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api/public/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Aiven MySQL Database Connection Variables
      - key: SPRING_DATASOURCE_URL
        sync: false
        # Format: jdbc:mysql://<AIVEN_HOST>:<AIVEN_PORT>/defaultdb?sslMode=REQUIRED
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
        # Example: avnadmin
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: "86400000"

  # React Frontend Single Page App
  - type: web
    name: pharmahealth-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: pharmahealth-backend
          property: host
          # Will append /api during runtime or build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Static Marketing & Showcase Page
  - type: web
    name: pharmahealth-static
    env: static
    staticPublishPath: ./static-page
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
