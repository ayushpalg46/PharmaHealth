services:
  # Service 1: Spring Boot Backend Web Service
  - type: web
    name: pharmahealth-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api/public/health
    envVars:
      - key: PORT
        value: "8080"
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Aiven Cloud MySQL Database Configuration
      - key: SPRING_DATASOURCE_URL
        value: jdbc:mysql://mysql-21-ayushpal-2c43.a.aivencloud.com:20661/defaultdb?sslMode=REQUIRED
      - key: SPRING_DATASOURCE_USERNAME
        value: avnadmin
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false # Enter your Aiven password in Render dashboard
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: "86400000"

  # Service 2: Single Static Site Frontend (React / Vite)
  - type: web
    name: pharmahealth-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      # Connects React frontend to deployed Spring Boot backend REST API
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: pharmahealth-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
